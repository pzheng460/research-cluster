[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-cluster"
version = "0.1.0"
description = "A CPU control plane for research agents with independent CPU/GPU execution pools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3", "pydantic>=2.8,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
temporal = ["temporalio>=1.8,<2"]
agent = ["openhands-sdk>=1.59,<2", "openhands-tools>=1.59,<2"]
dev = ["pytest>=8,<10", "playwright>=1.48,<2"]

[project.scripts]
research-cluster = "research_cluster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_cluster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
